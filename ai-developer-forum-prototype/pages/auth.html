    <style id="theme-vars">
/* AI辅助开发者论坛 · 品牌变量系统 */

:root {
  /* 品牌主色阶 (Indigo) - 唯一身份色 */
  --aidev-primary-50: #eef2ff;
  --aidev-primary-100: #e0e7ff;
  --aidev-primary-200: #c7d2fe;
  --aidev-primary-300: #a5b4fc;
  --aidev-primary-400: #818cf8;
  --aidev-primary-500: #6366f1;
  --aidev-primary-600: #4f46e5;
  --aidev-primary-700: #4338ca;
  --aidev-primary-800: #3730a3;
  --aidev-primary-900: #312e81;

  /* 中性色阶 */
  --aidev-neutral-0: #ffffff;
  --aidev-neutral-50: #f8fafc;
  --aidev-neutral-100: #f1f5f9;
  --aidev-neutral-200: #e2e8f0;
  --aidev-neutral-300: #cbd5e1;
  --aidev-neutral-400: #94a3b8;
  --aidev-neutral-500: #64748b;
  --aidev-neutral-600: #475569;
  --aidev-neutral-700: #334155;
  --aidev-neutral-800: #1e293b;
  --aidev-neutral-900: #0f172a;

  /* 状态语义色 */
  --aidev-state-success: #059669;
  --aidev-state-success-bg: rgba(5, 150, 105, 0.08);
  --aidev-state-warning: #d97706;
  --aidev-state-warning-bg: rgba(217, 119, 6, 0.08);
  --aidev-state-error: #dc2626;
  --aidev-state-error-bg: rgba(220, 38, 38, 0.08);
  --aidev-state-info: #2563eb;
  --aidev-state-info-bg: rgba(37, 99, 235, 0.08);

  /* 代码/深色表面 */
  --aidev-code-bg: #1e1b2e;
  --aidev-code-ink: #e2e0f0;

  /* 语义别名 */
  --aidev-background: var(--aidev-neutral-50);
  --aidev-foreground: var(--aidev-neutral-900);
  --aidev-card: var(--aidev-neutral-0);
  --aidev-card-foreground: var(--aidev-neutral-900);
  --aidev-popover: var(--aidev-neutral-0);
  --aidev-popover-foreground: var(--aidev-neutral-900);
  --aidev-primary: var(--aidev-primary-600);
  --aidev-primary-foreground: var(--aidev-neutral-0);
  --aidev-muted: var(--aidev-neutral-100);
  --aidev-muted-foreground: var(--aidev-neutral-500);
  --aidev-border: var(--aidev-neutral-200);
  --aidev-input: var(--aidev-neutral-200);
  --aidev-ring: var(--aidev-primary-600);

  /* 圆角 */
  --aidev-radius-sm: 4px;
  --aidev-radius-md: 8px;
  --aidev-radius-lg: 12px;
  --aidev-radius-full: 9999px;

  /* 阴影 - 静态表面 ≤ 0.05 alpha */
  --aidev-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --aidev-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05);
  --aidev-shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.05);
  --aidev-shadow-float: 0 16px 48px rgba(15, 23, 42, 0.12);

  /* 字体系统 */
  --aidev-font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --aidev-font-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  /* 间距 */
  --aidev-space-1: 0.25rem;
  --aidev-space-2: 0.5rem;
  --aidev-space-3: 0.75rem;
  --aidev-space-4: 1rem;
  --aidev-space-5: 1.25rem;
  --aidev-space-6: 1.5rem;
  --aidev-space-8: 2rem;
  --aidev-space-10: 2.5rem;
  --aidev-space-12: 3rem;

  /* 尺寸 */
  --aidev-header-height: 64px;
  --aidev-max-content: 1200px;
  --aidev-sidebar-width: 240px;
}

html.dark {
  --aidev-background: #0b0f19;
  --aidev-foreground: #f1f5f9;
  --aidev-card: #111827;
  --aidev-card-foreground: #f1f5f9;
  --aidev-popover: #111827;
  --aidev-popover-foreground: #f1f5f9;
  --aidev-muted: #1e293b;
  --aidev-muted-foreground: #94a3b8;
  --aidev-border: #1e293b;
  --aidev-input: #334155;
  --aidev-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --aidev-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
  --aidev-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.3);
  --aidev-code-bg: #1a1625;
}

/* 排版工具类 */
.font-sans { font-family: var(--aidev-font-sans); }
.font-mono { font-family: var(--aidev-font-mono); }

.text-display {
  font-size: 2.25rem;
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.text-headline {
  font-size: 1.5rem;
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.text-title {
  font-size: 1.125rem;
  line-height: 1.4;
  font-weight: 600;
}

.text-body {
  font-size: 0.9375rem;
  line-height: 1.7;
}

.text-caption {
  font-size: 0.8125rem;
  line-height: 1.5;
}

.text-label {
  font-size: 0.75rem;
  line-height: 1.4;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

    </style>

<body>
  <style>
    .aidev-skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      z-index: 200;
      padding: var(--aidev-space-2) var(--aidev-space-4);
      background-color: var(--aidev-primary);
      color: var(--aidev-primary-foreground);
      text-decoration: none;
      transition: top 0.15s ease;
    }

    .aidev-skip-link:focus {
      top: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .aidev-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: var(--aidev-background);
      color: var(--aidev-foreground);
      font-family: var(--aidev-font-sans);
    }

    .aidev-shell-header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      height: var(--aidev-header-height);
      background-color: var(--aidev-card);
      border-bottom: 1px solid var(--aidev-border);
      box-shadow: var(--aidev-shadow-sm);
    }

    .aidev-shell-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: var(--aidev-max-content);
      height: 100%;
      margin: 0 auto;
      padding: 0 var(--aidev-space-6);
    }

    .aidev-shell-brand {
      display: inline-flex;
      align-items: center;
      gap: var(--aidev-space-2);
      color: var(--aidev-foreground);
      font-size: 1.125rem;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .aidev-shell-brand:hover {
      color: var(--aidev-primary);
    }

    .aidev-shell-brand:focus-visible {
      outline: none;
      border-radius: var(--aidev-radius-md);
      box-shadow: 0 0 0 2px var(--aidev-ring);
    }

    .aidev-shell-logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--aidev-radius-md);
      background: linear-gradient(135deg, var(--aidev-primary-500), var(--aidev-primary-700));
      color: var(--aidev-primary-foreground);
    }

    .aidev-shell-logo-icon svg {
      width: 18px;
      height: 18px;
    }

    .aidev-shell-main {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: var(--aidev-max-content);
      margin: 0 auto;
      padding: var(--aidev-space-8) var(--aidev-space-4);
    }

    .aidev-auth-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--aidev-card);
      border: 1px solid var(--aidev-border);
      border-radius: var(--aidev-radius-lg);
      box-shadow: var(--aidev-shadow-lg);
      overflow: hidden;
    }

    .aidev-auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--aidev-border);
    }

    .aidev-auth-tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--aidev-space-2);
      padding: var(--aidev-space-4) var(--aidev-space-3);
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background-color: transparent;
      color: var(--aidev-muted-foreground);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .aidev-auth-tab:hover {
      color: var(--aidev-primary);
      background-color: var(--aidev-primary-50);
    }

    .aidev-auth-tab:focus-visible {
      outline: none;
      background-color: var(--aidev-primary-50);
      box-shadow: inset 0 0 0 2px var(--aidev-ring);
    }

    .aidev-auth-tab.is-active {
      color: var(--aidev-primary);
      border-bottom-color: var(--aidev-primary);
    }

    .aidev-auth-panels {
      padding: var(--aidev-space-8) var(--aidev-space-6);
    }

    .aidev-auth-panel {
      display: none;
    }

    .aidev-auth-panel:target,
    .aidev-auth-panel.is-active {
      display: block;
    }

    .aidev-auth-title {
      margin: 0 0 var(--aidev-space-2);
      font-size: 1.375rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--aidev-foreground);
      text-wrap: balance;
      word-break: keep-all;
    }

    .aidev-auth-subtitle {
      margin: 0 0 var(--aidev-space-6);
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--aidev-muted-foreground);
    }

    .aidev-auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--aidev-space-5);
    }

    .aidev-auth-field {
      display: flex;
      flex-direction: column;
      gap: var(--aidev-space-2);
    }

    .aidev-auth-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--aidev-foreground);
    }

    .aidev-auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .aidev-auth-input-icon {
      position: absolute;
      left: 12px;
      color: var(--aidev-muted-foreground);
      pointer-events: none;
    }

    .aidev-auth-input {
      width: 100%;
      height: 48px;
      padding: 0 var(--aidev-space-4) 0 var(--aidev-space-10);
      border: 1px solid var(--aidev-input);
      border-radius: var(--aidev-radius-md);
      background-color: var(--aidev-card);
      color: var(--aidev-foreground);
      font-size: 0.9375rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .aidev-auth-input:hover {
      border-color: var(--aidev-primary-300);
    }

    .aidev-auth-input:focus {
      outline: none;
      border-color: var(--aidev-ring);
      box-shadow: 0 0 0 3px var(--aidev-primary-100);
    }

    .aidev-auth-input.is-error {
      border-color: var(--aidev-state-error);
      background-color: var(--aidev-state-error-bg);
    }

    .aidev-auth-input.is-error:focus {
      box-shadow: 0 0 0 3px var(--aidev-state-error-bg);
    }

    .aidev-auth-error {
      display: none;
      align-items: center;
      gap: var(--aidev-space-1);
      font-size: 0.8125rem;
      color: var(--aidev-state-error);
    }

    .aidev-auth-field.is-invalid .aidev-auth-error {
      display: flex;
    }

    .aidev-auth-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--aidev-space-3);
      flex-wrap: wrap;
    }

    .aidev-auth-checkbox {
      display: inline-flex;
      align-items: center;
      gap: var(--aidev-space-2);
      font-size: 0.875rem;
      color: var(--aidev-muted-foreground);
      cursor: pointer;
    }

    .aidev-auth-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--aidev-primary);
      cursor: pointer;
    }

    .aidev-auth-link {
      font-size: 0.875rem;
      color: var(--aidev-primary);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .aidev-auth-link:hover {
      color: var(--aidev-primary-700);
      text-decoration: underline;
    }

    .aidev-auth-link:focus-visible {
      outline: none;
      border-radius: var(--aidev-radius-sm);
      box-shadow: 0 0 0 2px var(--aidev-ring);
    }

    .aidev-auth-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--aidev-space-2);
      width: 100%;
      height: 48px;
      padding: 0 var(--aidev-space-5);
      border: 1px solid transparent;
      border-radius: var(--aidev-radius-md);
      background-color: var(--aidev-primary);
      color: var(--aidev-primary-foreground);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .aidev-auth-submit:hover {
      background-color: var(--aidev-primary-700);
    }

    .aidev-auth-submit:active {
      transform: translateY(0);
    }

    .aidev-auth-submit:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--aidev-primary-200);
    }

    .aidev-auth-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .aidev-auth-divider {
      display: flex;
      align-items: center;
      gap: var(--aidev-space-3);
      margin: 0 var(--aidev-space-6);
      color: var(--aidev-muted-foreground);
      font-size: 0.8125rem;
    }

    .aidev-auth-divider::before,
    .aidev-auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: var(--aidev-border);
    }

    .aidev-auth-oauth {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--aidev-space-3);
      padding: var(--aidev-space-5) var(--aidev-space-6) var(--aidev-space-8);
    }

    .aidev-auth-oauth-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--aidev-space-2);
      height: 44px;
      padding: 0 var(--aidev-space-4);
      border: 1px solid var(--aidev-border);
      border-radius: var(--aidev-radius-md);
      background-color: var(--aidev-card);
      color: var(--aidev-foreground);
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .aidev-auth-oauth-btn:hover {
      background-color: var(--aidev-muted);
      border-color: var(--aidev-primary-300);
    }

    .aidev-auth-oauth-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--aidev-ring);
    }

  <script>
    (function () {
      // 标签切换逻辑：同步 aria 状态与面板显隐
      var tabs = document.querySelectorAll('.aidev-auth-tab');
      var panels = document.querySelectorAll('.aidev-auth-panel');

      function switchTab(targetId) {
          tabs.forEach(function (tab) {
            var isTarget = tab.getAttribute('href') === targetId;
            tab.classList.toggle('is-active', isTarget);
            tab.setAttribute('aria-selected', String(isTarget));
          });

          panels.forEach(function (panel) {
            var isTarget = panel.id === targetId.slice(1);
            panel.classList.toggle('is-active', isTarget);
            panel.hidden = !isTarget;
            // 无动画时保持 focus 可见性
            if (isTarget) {
              panel.removeAttribute('inert');
            } else {
              panel.setAttribute('inert', '');
            }
          });
        }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function (event) {
          event.preventDefault();
          switchTab(tab.getAttribute('href'));
          history.replaceState(null, '', tab.getAttribute('href'));
        });
      });

      // 根据 URL hash 初始化
      if (location.hash === '#register') {
        switchTab('#register');
      }

      // 技术栈标签选择
      var tags = document.querySelectorAll('.aidev-auth-tag');
      tags.forEach(function (tag) {
        tag.addEventListener('click', function () {
          tag.classList.toggle('is-selected');
          tag.setAttribute('aria-pressed', String(tag.classList.contains('is-selected')));
        });
      });

      // 表单验证与提交
      function validateField(field) {
        var input = field.querySelector('input, select, textarea');
        if (!input) return true;
        var valid = input.checkValidity();
        field.classList.toggle('is-invalid', !valid);
        return valid;
      }

      function attachValidation(formId) {
        var form = document.getElementById(formId);
        if (!form) return;

        var fields = form.querySelectorAll('.aidev-auth-field');
        fields.forEach(function (field) {
          var input = field.querySelector('input');
          if (!input) return;
          input.addEventListener('blur', function () {
            validateField(field);
          });
          input.addEventListener('input', function () {
            if (field.classList.contains('is-invalid')) {
              validateField(field);
            }
          });
        });

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var allValid = true;
          fields.forEach(function (field) {
            if (!validateField(field)) allValid = false;
          });

          if (allValid) {
            // 成功后跳转首页（cta-home 对应 page-index）
            window.location.href = './index.html';
          }
        });
      }

      attachValidation('login-form');
      attachValidation('register-form');

      // 初始化 Lucide 图标
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        lucide.createIcons();
      }
    })();
  </script>
