<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON SERPENT // 霓虹贪吃蛇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NEON SERPENT — 霓虹贪吃蛇
   设计方向：赛博朋克霓虹街机 / CRT 终端美学
   ============================================================ */

:root {
  --bg-deep: #05060f;
  --bg-mid: #0a0e1f;
  --grid-line: rgba(0, 240, 255, 0.06);
  --neon-cyan: #00f0ff;
  --neon-magenta: #ff2bd6;
  --neon-red: #ff1744;
  --neon-pink: #ff4081;
  --neon-green: #39ff14;
  --neon-yellow: #fff700;
  --neon-purple: #b026ff;
  --text-dim: #6a7a9a;
  --text-bright: #e8f4ff;
  --panel-bg: rgba(10, 14, 31, 0.85);
  --panel-border: rgba(0, 240, 255, 0.25);
  --glow-cyan: 0 0 8px rgba(0, 240, 255, 0.7), 0 0 20px rgba(0, 240, 255, 0.4);
  --glow-magenta: 0 0 8px rgba(255, 43, 214, 0.7), 0 0 20px rgba(255, 43, 214, 0.4);
  --glow-red: 0 0 8px rgba(255, 23, 68, 0.8), 0 0 22px rgba(255, 23, 68, 0.5);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  font-family: 'Share Tech Mono', monospace;
  color: var(--text-bright);
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

/* ---------- 背景氛围层 ---------- */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(176, 38, 255, 0.15), transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(0, 240, 255, 0.12), transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(255, 43, 214, 0.06), transparent 60%),
    var(--bg-deep);
}

/* 扫描线效果 */
.bg-layer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0,
    transparent 2px,
    rgba(0, 240, 255, 0.025) 2px,
    rgba(0, 240, 255, 0.025) 4px
  );
  mix-blend-mode: overlay;
}

/* 网格地板透视效果 */
.bg-grid {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) perspective(400px) rotateX(60deg);
  transform-origin: bottom;
  width: 200%;
  height: 50%;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.5;
  animation: gridMove 8s linear infinite;
  mask-image: linear-gradient(transparent 0%, black 60%);
  -webkit-mask-image: linear-gradient(transparent 0%, black 60%);
}

@keyframes gridMove {
  from { background-position: 0 0; }
  to { background-position: 0 40px; }
}

/* ---------- 主容器 ---------- */
#app {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
}

/* ---------- 标题 ---------- */
.game-title {
  font-family: 'Monoton', cursive;
  font-size: clamp(2.8rem, 11vw, 6.5rem);
  line-height: 0.95;
  text-align: center;
  letter-spacing: 0.05em;
  background: linear-gradient(180deg, var(--neon-cyan) 0%, var(--neon-magenta) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.6)) drop-shadow(0 0 24px rgba(255, 43, 214, 0.4));
  animation: titlePulse 3s ease-in-out infinite;
}

.game-subtitle {
  font-family: 'Orbitron', sans-serif;
  font-weight: 500;
  font-size: clamp(0.7rem, 2.5vw, 0.95rem);
  letter-spacing: 0.6em;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
  margin-top: 8px;
  margin-bottom: clamp(20px, 5vh, 40px);
  text-transform: uppercase;
  padding-left: 0.6em;
}

@keyframes titlePulse {
  0%, 100% { filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.6)) drop-shadow(0 0 24px rgba(255, 43, 214, 0.4)); }
  50% { filter: drop-shadow(0 0 18px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 36px rgba(255, 43, 214, 0.6)); }
}

/* ---------- 面板通用样式 ---------- */
.panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: clamp(20px, 4vw, 36px);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.12), inset 0 0 30px rgba(0, 240, 255, 0.03);
  width: 100%;
  max-width: 440px;
}

.panel-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 12px;
  display: block;
}

/* ---------- 难度选择器 ---------- */
.difficulty-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}

.diff-btn {
  position: relative;
  background: rgba(0, 240, 255, 0.04);
  border: 1.5px solid rgba(0, 240, 255, 0.2);
  border-radius: 10px;
  padding: 14px 8px;
  color: var(--text-dim);
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: center;
  overflow: hidden;
}

.diff-btn .speed-dots {
  display: flex;
  gap: 3px;
  justify-content: center;
  margin-top: 6px;
}

.diff-btn .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
}

.diff-btn:hover {
  border-color: var(--neon-cyan);
  color: var(--text-bright);
  background: rgba(0, 240, 255, 0.08);
}

.diff-btn.active {
  color: var(--text-bright);
  border-color: transparent;
  box-shadow: var(--glow-cyan);
}

.diff-btn[data-diff="easy"].active { background: rgba(57, 255, 20, 0.12); border-color: var(--neon-green); box-shadow: 0 0 12px rgba(57, 255, 20, 0.5); }
.diff-btn[data-diff="easy"].active .dot { background: var(--neon-green); box-shadow: 0 0 4px var(--neon-green); }

.diff-btn[data-diff="medium"].active { background: rgba(0, 240, 255, 0.12); border-color: var(--neon-cyan); box-shadow: var(--glow-cyan); }
.diff-btn[data-diff="medium"].active .dot { background: var(--neon-cyan); box-shadow: 0 0 4px var(--neon-cyan); }

.diff-btn[data-diff="hard"].active { background: rgba(255, 43, 214, 0.12); border-color: var(--neon-magenta); box-shadow: var(--glow-magenta); }
.diff-btn[data-diff="hard"].active .dot { background: var(--neon-magenta); box-shadow: 0 0 4px var(--neon-magenta); }

.diff-btn[data-diff="hell"].active { background: rgba(255, 23, 68, 0.12); border-color: var(--neon-red); box-shadow: var(--glow-red); }
.diff-btn[data-diff="hell"].active .dot { background: var(--neon-red); box-shadow: 0 0 4px var(--neon-red); }

/* ---------- 开关切换 ---------- */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-top: 1px solid rgba(0, 240, 255, 0.1);
}

.toggle-row .toggle-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.toggle-row .toggle-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-bright);
}

.toggle-row .toggle-desc {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

.toggle-switch {
  position: relative;
  width: 54px;
  height: 28px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(0, 240, 255, 0.2);
  cursor: pointer;
  transition: all 0.3s ease;
  flex-shrink: 0;
}

.toggle-switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.toggle-switch.on {
  background: rgba(0, 240, 255, 0.2);
  border-color: var(--neon-cyan);
  box-shadow: var(--glow-cyan);
}

.toggle-switch.on::after {
  left: 29px;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan);
}

/* ---------- 主按钮 ---------- */
.btn-primary {
  width: 100%;
  margin-top: 28px;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
  color: var(--bg-deep);
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.05rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), 0 4px 20px rgba(255, 43, 214, 0.3);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.6), 0 8px 30px rgba(255, 43, 214, 0.4);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border-radius: 10px;
  background: transparent;
  border: 1.5px solid rgba(0, 240, 255, 0.3);
  color: var(--neon-cyan);
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.25s ease;
}

.btn-secondary:hover {
  background: rgba(0, 240, 255, 0.08);
  border-color: var(--neon-cyan);
  box-shadow: var(--glow-cyan);
}

/* ---------- 高分显示（菜单） ---------- */
.highscore-display {
  margin-top: 24px;
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
}

.highscore-display .hs-value {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.4rem;
  color: var(--neon-yellow);
  text-shadow: 0 0 10px rgba(255, 247, 0, 0.6);
  display: block;
  margin-top: 4px;
}

/* ============================================================
   游戏主界面
   ============================================================ */
#screen-game {
  justify-content: flex-start;
  padding-top: 12px;
}

.hud {
  width: 100%;
  max-width: 560px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  padding: 0 4px;
  gap: 8px;
}

.hud-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}

.hud-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--text-dim);
  text-transform: uppercase;
}

.hud-value {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: clamp(1.3rem, 5vw, 1.9rem);
  line-height: 1.1;
  color: var(--text-bright);
}

.hud-value.score { color: var(--neon-cyan); text-shadow: var(--glow-cyan); }
.hud-value.best { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 247, 0, 0.5); }
.hud-value.level { color: var(--neon-magenta); text-shadow: var(--glow-magenta); }

/* 游戏画布容器 */
.canvas-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  width: 100%;
  max-width: 560px;
}

.canvas-frame {
  position: relative;
  border: 2px solid rgba(0, 240, 255, 0.3);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 25px rgba(0, 240, 255, 0.2), inset 0 0 25px rgba(0, 0, 0, 0.5);
  background: var(--bg-mid);
}

/* 边角装饰 */
.canvas-frame::before,
.canvas-frame::after {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  border: 2px solid var(--neon-cyan);
  z-index: 5;
  pointer-events: none;
}

.canvas-frame::before {
  top: -2px;
  left: -2px;
  border-right: none;
  border-bottom: none;
  border-top-left-radius: 12px;
  box-shadow: var(--glow-cyan);
}

.canvas-frame::after {
  bottom: -2px;
  right: -2px;
  border-left: none;
  border-top: none;
  border-bottom-right-radius: 12px;
  box-shadow: var(--glow-cyan);
}

#gameCanvas {
  display: block;
  background: var(--bg-mid);
}

/* 暂停遮罩 */
.pause-overlay {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(5, 6, 15, 0.8);
  backdrop-filter: blur(4px);
  z-index: 6;
  gap: 16px;
}

.pause-overlay.show {
  display: flex;
}

.pause-text {
  font-family: 'Monoton', cursive;
  font-size: clamp(2rem, 8vw, 3.5rem);
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
  letter-spacing: 0.1em;
}

.pause-hint {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* ---------- 触屏方向键 ---------- */
.touch-controls {
  display: none;
  margin-top: 14px;
  width: 100%;
  max-width: 560px;
  justify-content: center;
}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, 60px);
  grid-template-rows: repeat(3, 60px);
  gap: 6px;
}

.dpad-btn {
  background: rgba(0, 240, 255, 0.06);
  border: 1.5px solid rgba(0, 240, 255, 0.25);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--neon-cyan);
  font-size: 1.6rem;
  cursor: pointer;
  transition: all 0.1s ease;
  -webkit-tap-highlight-color: transparent;
}

.dpad-btn:active {
  background: rgba(0, 240, 255, 0.2);
  box-shadow: var(--glow-cyan);
  transform: scale(0.92);
}

.dpad-btn.empty { visibility: hidden; }

.dpad-up { grid-column: 2; grid-row: 1; }
.dpad-left { grid-column: 1; grid-row: 2; }
.dpad-right { grid-column: 3; grid-row: 2; }
.dpad-down { grid-column: 2; grid-row: 3; }
.dpad-center { grid-column: 2; grid-row: 2; }

/* 桌面控制提示 */
.desktop-hint {
  margin-top: 10px;
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-align: center;
  text-transform: uppercase;
}

.desktop-hint kbd {
  display: inline-block;
  padding: 1px 6px;
  background: rgba(0, 240, 255, 0.1);
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 4px;
  font-family: 'Share Tech Mono', monospace;
  color: var(--neon-cyan);
  font-size: 0.65rem;
  margin: 0 1px;
}

/* ============================================================
   游戏结束界面
   ============================================================ */
#screen-over .panel {
  text-align: center;
  max-width: 400px;
}

.over-title {
  font-family: 'Monoton', cursive;
  font-size: clamp(2.2rem, 9vw, 3.8rem);
  color: var(--neon-red);
  text-shadow: var(--glow-red);
  letter-spacing: 0.05em;
  margin-bottom: 20px;
  animation: glitch 2.5s infinite;
}

@keyframes glitch {
  0%, 90%, 100% { transform: translate(0); text-shadow: var(--glow-red); }
  92% { transform: translate(-2px, 1px); text-shadow: 2px 0 var(--neon-cyan), -2px 0 var(--neon-magenta); }
  94% { transform: translate(2px, -1px); text-shadow: -2px 0 var(--neon-cyan), 2px 0 var(--neon-magenta); }
  96% { transform: translate(0); }
}

.over-score-block {
  margin: 20px 0;
  padding: 20px;
  border: 1px solid rgba(0, 240, 255, 0.15);
  border-radius: 10px;
  background: rgba(0, 240, 255, 0.03);
}

.over-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--text-dim);
  text-transform: uppercase;
}

.over-score {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: clamp(2.8rem, 12vw, 4rem);
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
  line-height: 1;
  margin: 8px 0;
}

.over-best {
  font-size: 0.85rem;
  color: var(--neon-yellow);
  letter-spacing: 0.1em;
}

.over-best.new-record {
  animation: recordFlash 0.6s ease-in-out infinite alternate;
}

@keyframes recordFlash {
  from { text-shadow: 0 0 8px rgba(255, 247, 0, 0.4); }
  to { text-shadow: 0 0 20px rgba(255, 247, 0, 0.9); }
}

.over-stats {
  display: flex;
  justify-content: space-around;
  margin: 16px 0;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.over-stat-val {
  display: block;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--text-bright);
  margin-top: 4px;
}

/* ---------- 响应式适配 ---------- */

/* 平板 */
@media (min-width: 600px) and (max-width: 1024px) {
  .desktop-hint { display: none; }
}

/* 触屏设备显示方向键 */
@media (hover: none) and (pointer: coarse) {
  .touch-controls { display: flex; }
  .desktop-hint { display: none; }
}

/* 小屏手机优化 */
@media (max-width: 400px) {
  .difficulty-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .diff-btn { padding: 12px 4px; font-size: 0.78rem; }
  .dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
  .hud { gap: 4px; }
}

/* 横屏手机 */
@media (max-height: 500px) and (orientation: landscape) {
  #screen-game { flex-direction: row; padding: 8px; gap: 10px; }
  .hud { flex-direction: column; gap: 8px; max-width: 120px; }
  .canvas-wrap { max-width: none; }
  .touch-controls { margin-top: 0; }
  .game-subtitle { margin-bottom: 12px; }
}

/* 大屏桌面 */
@media (min-width: 1025px) {
  .touch-controls { display: none; }
}

/* 减少动画偏好 */
@media (prefers-reduced-motion: reduce) {
  .game-title, .bg-grid { animation: none; }
}
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-grid"></div>

<div id="app">

  <!-- ============ 开始菜单 ============ -->
  <section class="screen active" id="screen-menu">
    <h1 class="game-title">NEON<br>SERPENT</h1>
    <p class="game-subtitle">霓 虹 贪 吃 蛇</p>

    <div class="panel">
      <span class="panel-label">// 选择难度</span>
      <div class="difficulty-grid">
        <button class="diff-btn active" data-diff="easy">
          简单
          <div class="speed-dots"><span class="dot"></span><span class="dot" style="opacity:.3"></span><span class="dot" style="opacity:.3"></span><span class="dot" style="opacity:.3"></span></div>
        </button>
        <button class="diff-btn" data-diff="medium">
          中等
          <div class="speed-dots"><span class="dot"></span><span class="dot"></span><span class="dot" style="opacity:.3"></span><span class="dot" style="opacity:.3"></span></div>
        </button>
        <button class="diff-btn" data-diff="hard">
          困难
          <div class="speed-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot" style="opacity:.3"></span></div>
        </button>
        <button class="diff-btn" data-diff="hell">
          地狱
          <div class="speed-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        </button>
      </div>

      <span class="panel-label">// 地形设置</span>
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">穿墙模式</span>
          <span class="toggle-desc">开启后蛇可穿越边界从另一侧出现</span>
        </div>
        <div class="toggle-switch on" id="toggle-wall"></div>
      </div>

      <button class="btn-primary" id="btn-start">开始游戏</button>

      <div class="highscore-display">
        历史最高分
        <span class="hs-value" id="menu-highscore">0</span>
      </div>
    </div>
  </section>

  <!-- ============ 游戏主界面 ============ -->
  <section class="screen" id="screen-game">
    <div class="hud">
      <div class="hud-cell">
        <span class="hud-label">分数</span>
        <span class="hud-value score" id="hud-score">0</span>
      </div>
      <div class="hud-cell">
        <span class="hud-label">最高</span>
        <span class="hud-value best" id="hud-best">0</span>
      </div>
      <div class="hud-cell">
        <span class="hud-label">难度</span>
        <span class="hud-value level" id="hud-level">简单</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <div class="canvas-frame">
        <canvas id="gameCanvas"></canvas>
        <div class="pause-overlay" id="pause-overlay">
          <div class="pause-text">PAUSED</div>
          <div class="pause-hint">点击或按空格继续</div>
        </div>
      </div>
    </div>

    <!-- 触屏方向键 -->
    <div class="touch-controls">
      <div class="dpad">
        <div class="dpad-btn dpad-up" data-dir="up">▲</div>
        <div class="dpad-btn dpad-left" data-dir="left">◀</div>
        <div class="dpad-btn dpad-center" id="dpad-pause" style="font-size:1rem;">II</div>
        <div class="dpad-btn dpad-right" data-dir="right">▶</div>
        <div class="dpad-btn dpad-down" data-dir="down">▼</div>
      </div>
    </div>

    <div class="desktop-hint">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>WASD</kbd> 移动 · <kbd>空格</kbd> 暂停 · <kbd>Esc</kbd> 菜单
    </div>
  </section>

  <!-- ============ 游戏结束界面 ============ -->
  <section class="screen" id="screen-over">
    <div class="panel">
      <h2 class="over-title">GAME OVER</h2>

      <div class="over-score-block">
        <span class="over-label">最终得分</span>
        <div class="over-score" id="over-score">0</div>
        <div class="over-best" id="over-best">最高分 0</div>
      </div>

      <div class="over-stats">
        <div>食物数<span class="over-stat-val" id="over-food">0</span></div>
        <div>蛇身长<span class="over-stat-val" id="over-length">3</span></div>
        <div>难度<span class="over-stat-val" id="over-diff">简单</span></div>
      </div>

      <button class="btn-primary" id="btn-restart">再来一局</button>
      <button class="btn-secondary" id="btn-menu">返回菜单</button>
    </div>
  </section>

</div>

<script>
/* ============================================================
   NEON SERPENT — 游戏逻辑
   纯原生 JS · Canvas 渲染 · 无依赖
   ============================================================ */

(function () {
  'use strict';

  // ---------- 配置常量 ----------
  // 难度配置：移动间隔(ms) + 每食物基础分 + 倍率
  const DIFFICULTY = {
    easy:   { name: '简单', interval: 160, base: 10, mult: 1.0, color: '#39ff14' },
    medium: { name: '中等', interval: 110, base: 10, mult: 2.0, color: '#00f0ff' },
    hard:   { name: '困难', interval: 75,  base: 10, mult: 3.0, color: '#ff2bd6' },
    hell:   { name: '地狱', interval: 50,  base: 10, mult: 5.0, color: '#ff1744' }
  };

  // 霓虹蛇身色环（渐变循环）
  const BODY_COLORS = ['#00f0ff', '#00b3ff', '#7c4dff', '#b026ff', '#ff2bd6', '#ff4081'];

  // 网格配置
  const GRID_COLS = 20;
  const GRID_ROWS = 20;

  // ---------- 游戏状态 ----------
  const State = {
    running: false,
    paused: false,
    gameOver: false,
    difficulty: 'easy',
    wallPass: true,
    score: 0,
    foodCount: 0,
    highScore: 0,
    snake: [],          // [{x, y}, ...]  头在 index 0
    direction: { x: 1, y: 0 },
    nextDirection: { x: 1, y: 0 },
    food: { x: 0, y: 0 },
    lastMoveTime: 0,
    moveInterval: 160,
    foodPulse: 0         // 食物脉动动画相位
  };

  // ---------- DOM 引用 ----------
  const $ = (id) => document.getElementById(id);
  const canvas = $('gameCanvas');
  const ctx = canvas.getContext('2d');

  const screens = {
    menu: $('screen-menu'),
    game: $('screen-game'),
    over: $('screen-over')
  };

  // ---------- 画布尺寸自适应 ----------
  let cellSize = 20;
  let canvasW = 0, canvasH = 0;

  function resizeCanvas() {
    const wrap = canvas.parentElement; // .canvas-frame
    const gameScreen = screens.game;
    // 可用空间计算
    const availW = Math.min(gameScreen.clientWidth - 8, 560);
    // 高度：屏幕高度减去 HUD、触屏键、提示的高度
    const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    const isLandscape = window.innerHeight < 500;
    let reservedH = 90; // HUD + margin
    if (isTouch && !isLandscape) reservedH += 200; // 触屏方向键
    if (!isTouch && !isLandscape) reservedH += 40;  // 桌面提示
    const availH = gameScreen.clientHeight - reservedH;

    let size = Math.min(availW, availH);
    size = Math.max(size, 200); // 最小 200px

    // 让 cellSize 为整数，避免渲染模糊
    cellSize = Math.floor(size / GRID_COLS);
    canvasW = cellSize * GRID_COLS;
    canvasH = cellSize * GRID_ROWS;

    // 高 DPI 支持
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvasW * dpr;
    canvas.height = canvasH * dpr;
    canvas.style.width = canvasW + 'px';
    canvas.style.height = canvasH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- 屏幕切换 ----------
  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    if (name === 'game') {
      // 延迟一帧确保布局完成后调整画布
      requestAnimationFrame(resizeCanvas);
    }
  }

  // ---------- 本地存储 ----------
  const STORAGE_KEY = 'neon_serpent_highscore';

  function loadHighScore() {
    try {
      const v = localStorage.getItem(STORAGE_KEY);
      State.highScore = v ? parseInt(v, 10) || 0 : 0;
    } catch (e) {
      State.highScore = 0;
    }
    updateHighScoreUI();
  }

  function saveHighScore() {
    try {
      localStorage.setItem(STORAGE_KEY, String(State.highScore));
    } catch (e) { /* 忽略存储失败 */ }
  }

  function updateHighScoreUI() {
    $('menu-highscore').textContent = State.highScore;
    $('hud-best').textContent = State.highScore;
  }

  // ---------- 游戏初始化 ----------
  function initGame() {
    const d = DIFFICULTY[State.difficulty];
    State.moveInterval = d.interval;
    State.score = 0;
    State.foodCount = 0;
    State.gameOver = false;
    State.paused = false;
    State.direction = { x: 1, y: 0 };
    State.nextDirection = { x: 1, y: 0 };

    // 蛇初始 3 节，位于中央偏左，朝右
    const cx = Math.floor(GRID_COLS / 2);
    const cy = Math.floor(GRID_ROWS / 2);
    State.snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy }
    ];

    spawnFood();
    updateHUD();
    resizeCanvas();
  }

  // ---------- 食物生成 ----------
  function spawnFood() {
    const occupied = new Set(State.snake.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < GRID_ROWS; y++) {
      for (let x = 0; x < GRID_COLS; x++) {
        if (!occupied.has(x + ',' + y)) free.push({ x, y });
      }
    }
    if (free.length === 0) {
      // 蛇填满全场 — 胜利
      endGame(true);
      return;
    }
    State.food = free[Math.floor(Math.random() * free.length)];
  }

  // ---------- HUD 更新 ----------
  function updateHUD() {
    $('hud-score').textContent = State.score;
    $('hud-best').textContent = State.highScore;
    $('hud-level').textContent = DIFFICULTY[State.difficulty].name;
  }

  // ---------- 方向输入 ----------
  function setDirection(dx, dy) {
    // 阻止 180 度反向（基于当前实际方向）
    if (State.direction.x === -dx && State.direction.y === -dy) return;
    // 阻止同方向重复设置（无意义）
    if (State.direction.x === dx && State.direction.y === dy) return;
    State.nextDirection = { x: dx, y: dy };
  }

  // ---------- 游戏主循环 ----------
  let rafId = null;

  function gameLoop(timestamp) {
    if (!State.running) return;

    if (!State.paused && !State.gameOver) {
      State.foodPulse += 0.08;
      if (timestamp - State.lastMoveTime >= State.moveInterval) {
        State.lastMoveTime = timestamp;
        step();
      }
    }
    render();
    rafId = requestAnimationFrame(gameLoop);
  }

  // ---------- 单步移动逻辑 ----------
  function step() {
    State.direction = State.nextDirection;

    const head = State.snake[0];
    let nx = head.x + State.direction.x;
    let ny = head.y + State.direction.y;

    // 边界处理
    if (State.wallPass) {
      // 穿墙
      nx = (nx + GRID_COLS) % GRID_COLS;
      ny = (ny + GRID_ROWS) % GRID_ROWS;
    } else {
      // 撞墙死亡
      if (nx < 0 || nx >= GRID_COLS || ny < 0 || ny >= GRID_ROWS) {
        endGame(false);
        return;
      }
    }

    // 自撞检测（排除尾巴：如果不吃食物，尾巴会移走）
    const willEat = (nx === State.food.x && ny === State.food.y);
    // 检查身体碰撞（最后一节在不吃食物时会让位）
    const bodyToCheck = willEat ? State.snake : State.snake.slice(0, -1);
    for (let i = 0; i < bodyToCheck.length; i++) {
      if (bodyToCheck[i].x === nx && bodyToCheck[i].y === ny) {
        endGame(false);
        return;
      }
    }

    // 移动蛇
    State.snake.unshift({ x: nx, y: ny });

    if (willEat) {
      const d = DIFFICULTY[State.difficulty];
      State.score += Math.round(d.base * d.mult);
      State.foodCount++;
      spawnFood();
      updateHUD();
    } else {
      State.snake.pop();
    }
  }

  // ---------- 渲染 ----------
  function render() {
    // 清屏 + 背景
    ctx.fillStyle = '#0a0e1f';
    ctx.fillRect(0, 0, canvasW, canvasH);

    // 网格线
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cellSize + 0.5, 0);
      ctx.lineTo(i * cellSize + 0.5, canvasH);
      ctx.stroke();
    }
    for (let i = 0; i <= GRID_ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * cellSize + 0.5);
      ctx.lineTo(canvasW, i * cellSize + 0.5);
      ctx.stroke();
    }

    // 穿墙模式提示边界（虚线）
    if (State.wallPass) {
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(0.5, 0.5, canvasW - 1, canvasH - 1);
      ctx.setLineDash([]);
    }

    // 绘制食物（脉动霓虹）
    drawFood();

    // 绘制蛇
    drawSnake();
  }

  function drawFood() {
    const f = State.food;
    const cx = f.x * cellSize + cellSize / 2;
    const cy = f.y * cellSize + cellSize / 2;
    const pulse = Math.sin(State.foodPulse) * 0.15 + 0.85; // 0.7~1.0
    const r = cellSize * 0.38 * pulse;

    // 外发光
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, cellSize * 0.9);
    glow.addColorStop(0, 'rgba(255, 247, 0, 0.5)');
    glow.addColorStop(0.5, 'rgba(255, 247, 0, 0.15)');
    glow.addColorStop(1, 'rgba(255, 247, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(f.x * cellSize - cellSize, f.y * cellSize - cellSize, cellSize * 3, cellSize * 3);

    // 食物本体（菱形）
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI / 4);
    ctx.shadowColor = '#fff700';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#fff700';
    const s = r * 1.3;
    ctx.fillRect(-s / 2, -s / 2, s, s);
    // 高光
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.fillRect(-s / 2, -s / 2, s * 0.4, s * 0.4);
    ctx.restore();
  }

  function drawSnake() {
    const len = State.snake.length;
    for (let i = len - 1; i >= 0; i--) {
      const seg = State.snake[i];
      const px = seg.x * cellSize;
      const py = seg.y * cellSize;
      const pad = Math.max(1, cellSize * 0.08);

      if (i === 0) {
        // 蛇头 — 红色霓虹
        ctx.shadowColor = '#ff1744';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#ff1744';
        roundRect(ctx, px + pad, py + pad, cellSize - pad * 2, cellSize - pad * 2, cellSize * 0.25);
        ctx.fill();

        // 眼睛
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        const eyeOff = cellSize * 0.22;
        const eyeR = Math.max(1, cellSize * 0.08);
        const dir = State.direction;
        let e1x, e1y, e2x, e2y;
        if (dir.x !== 0) {
          // 水平方向
          e1x = px + cellSize / 2 + dir.x * eyeOff;
          e2x = e1x;
          e1y = py + cellSize * 0.32;
          e2y = py + cellSize * 0.68;
        } else {
          // 垂直方向
          e1y = py + cellSize / 2 + dir.y * eyeOff;
          e2y = e1y;
          e1x = px + cellSize * 0.32;
          e2x = px + cellSize * 0.68;
        }
        ctx.beginPath();
        ctx.arc(e1x, e1y, eyeR, 0, Math.PI * 2);
        ctx.arc(e2x, e2y, eyeR, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 蛇身 — 霓虹渐变色环
        const colorIdx = (i - 1) % BODY_COLORS.length;
        const c = BODY_COLORS[colorIdx];
        ctx.shadowColor = c;
        ctx.shadowBlur = 8;
        ctx.fillStyle = c;
        // 身体随距离略微缩小
        const shrink = Math.min(pad + (cellSize * 0.02 * (i / len)), cellSize * 0.18);
        roundRect(ctx, px + shrink, py + shrink, cellSize - shrink * 2, cellSize - shrink * 2, cellSize * 0.2);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
  }

  // 圆角矩形辅助函数
  function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- 游戏结束 ----------
  function endGame(isWin) {
    State.gameOver = true;
    State.running = false;
    cancelAnimationFrame(rafId);

    const isNewRecord = State.score > State.highScore;
    if (isNewRecord) {
      State.highScore = State.score;
      saveHighScore();
    }
    updateHighScoreUI();

    // 填充结束界面
    $('over-score').textContent = State.score;
    const bestEl = $('over-best');
    if (isNewRecord) {
      bestEl.textContent = '★ 新纪录！★';
      bestEl.classList.add('new-record');
    } else {
      bestEl.textContent = '最高分 ' + State.highScore;
      bestEl.classList.remove('new-record');
    }
    $('over-food').textContent = State.foodCount;
    $('over-length').textContent = State.snake.length;
    $('over-diff').textContent = DIFFICULTY[State.difficulty].name;

    // 死亡闪烁效果后切换
    flashScreen(() => showScreen('over'));
  }

  function flashScreen(callback) {
    canvas.style.transition = 'filter 0.15s';
    canvas.style.filter = 'brightness(3) hue-rotate(-30deg)';
    setTimeout(() => {
      canvas.style.filter = '';
      setTimeout(callback, 150);
    }, 200);
  }

  // ---------- 暂停 ----------
  function togglePause() {
    if (!State.running || State.gameOver) return;
    State.paused = !State.paused;
    $('pause-overlay').classList.toggle('show', State.paused);
    if (!State.paused) {
      State.lastMoveTime = performance.now();
    }
  }

  // ---------- 开始 / 重启 ----------
  function startGame() {
    initGame();
    showScreen('game');
    State.running = true;
    State.lastMoveTime = performance.now();
    rafId = requestAnimationFrame(gameLoop);
  }

  // ---------- 事件绑定 ----------

  // 难度按钮
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      State.difficulty = btn.dataset.diff;
    });
  });

  // 穿墙开关
  $('toggle-wall').addEventListener('click', () => {
    State.wallPass = !State.wallPass;
    $('toggle-wall').classList.toggle('on', State.wallPass);
  });

  // 开始 / 重启 / 菜单
  $('btn-start').addEventListener('click', startGame);
  $('btn-restart').addEventListener('click', startGame);
  $('btn-menu').addEventListener('click', () => {
    State.running = false;
    cancelAnimationFrame(rafId);
    showScreen('menu');
    updateHighScoreUI();
  });

  // 键盘控制
  const keyMap = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], W: [0, -1], s: [0, 1], S: [0, 1], a: [-1, 0], A: [-1, 0], d: [1, 0], D: [1, 0]
  };

  document.addEventListener('keydown', (e) => {
    if (keyMap[e.key]) {
      e.preventDefault();
      if (State.running) {
        const [dx, dy] = keyMap[e.key];
        setDirection(dx, dy);
      }
    } else if (e.key === ' ') {
      e.preventDefault();
      togglePause();
    } else if (e.key === 'Escape') {
      if (State.running) {
        State.running = false;
        cancelAnimationFrame(rafId);
        showScreen('menu');
      }
    } else if (e.key === 'Enter') {
      // 菜单/结束界面回车快速开始
      if (screens.menu.classList.contains('active') || screens.over.classList.contains('active')) {
        startGame();
      }
    }
  });

  // 触屏方向键
  document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
    const dir = btn.dataset.dir;
    const handler = (e) => {
      e.preventDefault();
      if (!State.running) return;
      switch (dir) {
        case 'up': setDirection(0, -1); break;
        case 'down': setDirection(0, 1); break;
        case 'left': setDirection(-1, 0); break;
        case 'right': setDirection(1, 0); break;
      }
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('mousedown', handler);
  });

  // 中心键暂停
  $('dpad-pause').addEventListener('touchstart', (e) => { e.preventDefault(); togglePause(); }, { passive: false });
  $('dpad-pause').addEventListener('click', togglePause);

  // 滑动手势控制（在画布上）
  let touchStartX = 0, touchStartY = 0, touchActive = false;
  const SWIPE_MIN = 20;

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchActive = true;
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (!touchActive || !State.running) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (absX < SWIPE_MIN && absY < SWIPE_MIN) return;

    if (absX > absY) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
    // 重置起点以支持连续滑动转向
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', () => { touchActive = false; }, { passive: true });

  // 点击暂停遮罩恢复
  $('pause-overlay').addEventListener('click', togglePause);

  // 窗口尺寸变化
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (screens.game.classList.contains('active')) resizeCanvas();
    }, 100);
  });

  // 屏幕方向变化
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { if (screens.game.classList.contains('active')) resizeCanvas(); }, 300);
  });

  // ---------- 启动 ----------
  loadHighScore();
  showScreen('menu');

})();
</script>

</body>
</html>
