<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* AI辅助开发者论坛 · 品牌变量系统 */

:root {
  /* 品牌主色阶 (Indigo) - 唯一身份色 */
  --aidev-primary-50: #eef2ff;
  --aidev-primary-100: #e0e7ff;
  --aidev-primary-200: #c7d2fe;
  --aidev-primary-300: #a5b4fc;
  --aidev-primary-400: #818cf8;
  --aidev-primary-500: #6366f1;
  --aidev-primary-600: #4f46e5;
  --aidev-primary-700: #4338ca;
  --aidev-primary-800: #3730a3;
  --aidev-primary-900: #312e81;

  /* 中性色阶 */
  --aidev-neutral-0: #ffffff;
  --aidev-neutral-50: #f8fafc;
  --aidev-neutral-100: #f1f5f9;
  --aidev-neutral-200: #e2e8f0;
  --aidev-neutral-300: #cbd5e1;
  --aidev-neutral-400: #94a3b8;
  --aidev-neutral-500: #64748b;
  --aidev-neutral-600: #475569;
  --aidev-neutral-700: #334155;
  --aidev-neutral-800: #1e293b;
  --aidev-neutral-900: #0f172a;

  /* 状态语义色 */
  --aidev-state-success: #059669;
  --aidev-state-success-bg: rgba(5, 150, 105, 0.08);
  --aidev-state-warning: #d97706;
  --aidev-state-warning-bg: rgba(217, 119, 6, 0.08);
  --aidev-state-error: #dc2626;
  --aidev-state-error-bg: rgba(220, 38, 38, 0.08);
  --aidev-state-info: #2563eb;
  --aidev-state-info-bg: rgba(37, 99, 235, 0.08);

  /* 代码/深色表面 */
  --aidev-code-bg: #1e1b2e;
  --aidev-code-ink: #e2e0f0;

  /* 语义别名 */
  --aidev-background: var(--aidev-neutral-50);
  --aidev-foreground: var(--aidev-neutral-900);
  --aidev-card: var(--aidev-neutral-0);
  --aidev-card-foreground: var(--aidev-neutral-900);
  --aidev-popover: var(--aidev-neutral-0);
  --aidev-popover-foreground: var(--aidev-neutral-900);
  --aidev-primary: var(--aidev-primary-600);
  --aidev-primary-foreground: var(--aidev-neutral-0);
  --aidev-muted: var(--aidev-neutral-100);
  --aidev-muted-foreground: var(--aidev-neutral-500);
  --aidev-border: var(--aidev-neutral-200);
  --aidev-input: var(--aidev-neutral-200);
  --aidev-ring: var(--aidev-primary-600);

  /* 圆角 */
  --aidev-radius-sm: 4px;
  --aidev-radius-md: 8px;
  --aidev-radius-lg: 12px;
  --aidev-radius-full: 9999px;

  /* 阴影 - 静态表面 ≤ 0.05 alpha */
  --aidev-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --aidev-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05);
  --aidev-shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.05);
  --aidev-shadow-float: 0 16px 48px rgba(15, 23, 42, 0.12);

  /* 字体系统 */
  --aidev-font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --aidev-font-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  /* 间距 */
  --aidev-space-1: 0.25rem;
  --aidev-space-2: 0.5rem;
  --aidev-space-3: 0.75rem;
  --aidev-space-4: 1rem;
  --aidev-space-5: 1.25rem;
  --aidev-space-6: 1.5rem;
  --aidev-space-8: 2rem;
  --aidev-space-10: 2.5rem;
  --aidev-space-12: 3rem;

  /* 尺寸 */
  --aidev-header-height: 64px;
  --aidev-max-content: 1200px;
  --aidev-sidebar-width: 240px;
}

html.dark {
  --aidev-background: #0b0f19;
  --aidev-foreground: #f1f5f9;
  --aidev-card: #111827;
  --aidev-card-foreground: #f1f5f9;
  --aidev-popover: #111827;
  --aidev-popover-foreground: #f1f5f9;
  --aidev-muted: #1e293b;
  --aidev-muted-foreground: #94a3b8;
  --aidev-border: #1e293b;
  --aidev-input: #334155;
  --aidev-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --aidev-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
  --aidev-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.3);
  --aidev-code-bg: #1a1625;
}

/* 排版工具类 */
.font-sans { font-family: var(--aidev-font-sans); }
.font-mono { font-family: var(--aidev-font-mono); }

.text-display {
  font-size: 2.25rem;
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.text-headline {
  font-size: 1.5rem;
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.text-title {
  font-size: 1.125rem;
  line-height: 1.4;
  font-weight: 600;
}

.text-body {
  font-size: 0.9375rem;
  line-height: 1.7;
}

.text-caption {
  font-size: 0.8125rem;
  line-height: 1.5;
}

.text-label {
  font-size: 0.75rem;
  line-height: 1.4;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--aidev-background);
    --color-foreground: var(--aidev-foreground);
    --color-card: var(--aidev-card);
    --color-card-foreground: var(--aidev-card-foreground);
    --color-popover: var(--aidev-popover);
    --color-popover-foreground: var(--aidev-popover-foreground);
    --color-primary: var(--aidev-primary);
    --color-primary-foreground: var(--aidev-primary-foreground);
    --color-muted: var(--aidev-muted);
    --color-muted-foreground: var(--aidev-muted-foreground);
    --color-border: var(--aidev-border);
    --color-input: var(--aidev-input);
    --color-ring: var(--aidev-ring);
    --radius-sm: var(--aidev-radius-sm);
    --radius-md: var(--aidev-radius-md);
    --radius-lg: var(--aidev-radius-lg);
  }
  @layer base {
    body { background: var(--aidev-background); color: var(--aidev-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-background { color: var(--aidev-background); }

      .bg-foreground { background-color: var(--aidev-foreground); }

      .ring-card { --tw-ring-color: var(--aidev-card); }
      .bg-card-foreground { background-color: var(--aidev-card-foreground); }
      .text-card-foreground { color: var(--aidev-card-foreground); }
      .border-card-foreground { border-color: var(--aidev-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--aidev-card-foreground); }
      .bg-popover { background-color: var(--aidev-popover); }
      .text-popover { color: var(--aidev-popover); }
      .border-popover { border-color: var(--aidev-popover); }
      .ring-popover { --tw-ring-color: var(--aidev-popover); }
      .bg-popover-foreground { background-color: var(--aidev-popover-foreground); }

      .border-popover-foreground { border-color: var(--aidev-popover-foreground); }

      .bg-primary { background-color: var(--aidev-primary); }
      .text-primary { color: var(--aidev-primary); }
      .border-primary { border-color: var(--aidev-primary); }
      .ring-primary { --tw-ring-color: var(--aidev-primary); }
      .bg-primary-foreground { background-color: var(--aidev-primary-foreground); }
      .text-primary-foreground { color: var(--aidev-primary-foreground); }

      .bg-muted { background-color: var(--aidev-muted); }

      .ring-muted { --tw-ring-color: var(--aidev-muted); }

      .bg-border { background-color: var(--aidev-border); }

      .bg-input { background-color: var(--aidev-input); }
      .text-input { color: var(--aidev-input); }
      .border-input { border-color: var(--aidev-input); }
      .ring-input { --tw-ring-color: var(--aidev-input); }
      .bg-ring { background-color: var(--aidev-ring); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;

        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
