/* AI辅助开发者论坛 · 品牌变量系统 */

:root {
  /* 品牌主色阶 (Indigo) - 唯一身份色 */
  --aidev-primary-50: #eef2ff;
  --aidev-primary-100: #e0e7ff;
  --aidev-primary-200: #c7d2fe;
  --aidev-primary-300: #a5b4fc;
  --aidev-primary-400: #818cf8;
  --aidev-primary-500: #6366f1;
  --aidev-primary-600: #4f46e5;
  --aidev-primary-700: #4338ca;
  --aidev-primary-800: #3730a3;
  --aidev-primary-900: #312e81;

  /* 中性色阶 */
  --aidev-neutral-0: #ffffff;
  --aidev-neutral-50: #f8fafc;
  --aidev-neutral-100: #f1f5f9;
  --aidev-neutral-200: #e2e8f0;
  --aidev-neutral-300: #cbd5e1;
  --aidev-neutral-400: #94a3b8;
  --aidev-neutral-500: #64748b;
  --aidev-neutral-600: #475569;
  --aidev-neutral-700: #334155;
  --aidev-neutral-800: #1e293b;
  --aidev-neutral-900: #0f172a;

  /* 状态语义色 */
  --aidev-state-success: #059669;
  --aidev-state-success-bg: rgba(5, 150, 105, 0.08);
  --aidev-state-warning: #d97706;
  --aidev-state-warning-bg: rgba(217, 119, 6, 0.08);
  --aidev-state-error: #dc2626;
  --aidev-state-error-bg: rgba(220, 38, 38, 0.08);
  --aidev-state-info: #2563eb;
  --aidev-state-info-bg: rgba(37, 99, 235, 0.08);

  /* 代码/深色表面 */
  --aidev-code-bg: #1e1b2e;
  --aidev-code-ink: #e2e0f0;

  /* 语义别名 */
  --aidev-background: var(--aidev-neutral-50);
  --aidev-foreground: var(--aidev-neutral-900);
  --aidev-card: var(--aidev-neutral-0);
  --aidev-card-foreground: var(--aidev-neutral-900);
  --aidev-popover: var(--aidev-neutral-0);
  --aidev-popover-foreground: var(--aidev-neutral-900);
  --aidev-primary: var(--aidev-primary-600);
  --aidev-primary-foreground: var(--aidev-neutral-0);
  --aidev-muted: var(--aidev-neutral-100);
  --aidev-muted-foreground: var(--aidev-neutral-500);
  --aidev-border: var(--aidev-neutral-200);
  --aidev-input: var(--aidev-neutral-200);
  --aidev-ring: var(--aidev-primary-600);

  /* 圆角 */
  --aidev-radius-sm: 4px;
  --aidev-radius-md: 8px;
  --aidev-radius-lg: 12px;
  --aidev-radius-full: 9999px;

  /* 阴影 - 静态表面 ≤ 0.05 alpha */
  --aidev-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --aidev-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05);
  --aidev-shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.05);
  --aidev-shadow-float: 0 16px 48px rgba(15, 23, 42, 0.12);

  /* 字体系统 */
  --aidev-font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --aidev-font-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  /* 间距 */
  --aidev-space-1: 0.25rem;
  --aidev-space-2: 0.5rem;
  --aidev-space-3: 0.75rem;
  --aidev-space-4: 1rem;
  --aidev-space-5: 1.25rem;
  --aidev-space-6: 1.5rem;
  --aidev-space-8: 2rem;
  --aidev-space-10: 2.5rem;
  --aidev-space-12: 3rem;

  /* 尺寸 */
  --aidev-header-height: 64px;
  --aidev-max-content: 1200px;
  --aidev-sidebar-width: 240px;
}

html.dark {
  --aidev-background: #0b0f19;
  --aidev-foreground: #f1f5f9;
  --aidev-card: #111827;
  --aidev-card-foreground: #f1f5f9;
  --aidev-popover: #111827;
  --aidev-popover-foreground: #f1f5f9;
  --aidev-muted: #1e293b;
  --aidev-muted-foreground: #94a3b8;
  --aidev-border: #1e293b;
  --aidev-input: #334155;
  --aidev-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --aidev-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
  --aidev-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.3);
  --aidev-code-bg: #1a1625;
}

/* 排版工具类 */
.font-sans { font-family: var(--aidev-font-sans); }
.font-mono { font-family: var(--aidev-font-mono); }

.text-display {
  font-size: 2.25rem;
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.text-headline {
  font-size: 1.5rem;
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.text-title {
  font-size: 1.125rem;
  line-height: 1.4;
  font-weight: 600;
}

.text-body {
  font-size: 0.9375rem;
  line-height: 1.7;
}

.text-caption {
  font-size: 0.8125rem;
  line-height: 1.5;
}

.text-label {
  font-size: 0.75rem;
  line-height: 1.4;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

<!-- AI 开发者论坛 · 共享项目外壳片段 -->
<style id="aidev-shell-layout">
  .aidev-shell {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background-color: var(--aidev-background);
    color: var(--aidev-foreground);
    font-family: var(--aidev-font-sans);
  }

  .aidev-shell-header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    height: var(--aidev-header-height);
    background-color: var(--aidev-card);
    border-bottom: 1px solid var(--aidev-border);
    box-shadow: var(--aidev-shadow-sm);
  }

  .aidev-shell-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--aidev-space-4);
    max-width: var(--aidev-max-content);
    height: 100%;
    margin: 0 auto;
    padding: 0 var(--aidev-space-6);
  }

  .aidev-shell-brand {
    display: inline-flex;
    align-items: center;
    gap: var(--aidev-space-2);
    color: var(--aidev-foreground);
    font-size: 1.125rem;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .aidev-shell-brand:hover {
    color: var(--aidev-primary);
  }

  .aidev-shell-logo-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: var(--aidev-radius-md);
    background: linear-gradient(135deg, var(--aidev-primary-500), var(--aidev-primary-700));
    color: var(--aidev-primary-foreground);
  }

  .aidev-shell-logo-icon svg {
    width: 18px;
    height: 18px;
  }

  .aidev-shell-search {
    position: relative;
    flex: 1 1 auto;
    max-width: 420px;
    min-width: 160px;
  }

  .aidev-shell-search-icon {
    position: absolute;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    color: var(--aidev-muted-foreground);
    pointer-events: none;
  }

  .aidev-shell-search-input {
    width: 100%;
    height: 40px;
    padding: 0 var(--aidev-space-4) 0 var(--aidev-space-10);
    border: 1px solid var(--aidev-input);
    border-radius: var(--aidev-radius-full);
    background-color: var(--aidev-muted);
    color: var(--aidev-foreground);
    font-size: 0.9375rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
  }

  .aidev-shell-search-input::placeholder {
    color: var(--aidev-muted-foreground);
  }

  .aidev-shell-search-input:hover {
    border-color: var(--aidev-primary-300);
  }

  .aidev-shell-search-input:focus {
    outline: none;
    border-color: var(--aidev-ring);
    background-color: var(--aidev-card);
    box-shadow: 0 0 0 3px var(--aidev-primary-100);
  }

  .aidev-shell-nav {
    display: flex;
    align-items: center;
    gap: var(--aidev-space-1);
    flex-shrink: 0;
  }

  .aidev-shell-nav-link {
    display: inline-flex;
    align-items: center;
    gap: var(--aidev-space-2);
    padding: var(--aidev-space-2) var(--aidev-space-3);
    border-radius: var(--aidev-radius-md);
    color: var(--aidev-neutral-600);
    font-size: 0.9375rem;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  .aidev-shell-nav-link:hover {
    color: var(--aidev-primary);
    background-color: var(--aidev-primary-50);
  }

  .aidev-shell-nav-link:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--aidev-ring);
  }

  .aidev-shell-nav-link svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .aidev-shell-nav-link.is-active {
    color: var(--aidev-primary);
    background-color: var(--aidev-primary-50);
  }

  .aidev-shell-auth {
    display: flex;
    align-items: center;
    gap: var(--aidev-space-3);
    flex-shrink: 0;
  }

  .aidev-shell-avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: var(--aidev-radius-full);
    background-color: var(--aidev-primary-100);
    color: var(--aidev-primary-700);
    border: 1px solid var(--aidev-border);
  }

  .aidev-shell-auth-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 var(--aidev-space-4);
    border: 1px solid transparent;
    border-radius: var(--aidev-radius-md);
    background-color: var(--aidev-primary);
    color: var(--aidev-primary-foreground);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.15s ease, box-shadow 0.15s ease;
  }

  .aidev-shell-auth-button:hover {
    background-color: var(--aidev-primary-700);
  }

  .aidev-shell-auth-button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--aidev-primary-200);
  }

  .aidev-shell-main {
    flex: 1 0 auto;
    width: 100%;
    max-width: var(--aidev-max-content);
    margin: 0 auto;
    padding: var(--aidev-space-6);
  }

  .aidev-shell-footer {
    width: 100%;
    border-top: 1px solid var(--aidev-border);
    background-color: var(--aidev-card);
  }

  .aidev-shell-footer-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--aidev-space-4);
    max-width: var(--aidev-max-content);
    margin: 0 auto;
    padding: var(--aidev-space-6);
  }

  .aidev-shell-footer-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--aidev-space-4);
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .aidev-shell-footer-links a {
    color: var(--aidev-muted-foreground);
    font-size: 0.875rem;
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .aidev-shell-footer-links a:hover {
    color: var(--aidev-primary);
  }

  .aidev-shell-slogan {
    color: var(--aidev-muted-foreground);
    font-size: 0.875rem;
    white-space: nowrap;
  }

  @media (max-width: 1024px) {
    .aidev-shell-header-inner {
      padding: 0 var(--aidev-space-4);
    }

    .aidev-shell-nav-link span {
      display: none;
    }

    .aidev-shell-nav-link {
      padding: var(--aidev-space-2);
    }
  }

  @media (max-width: 640px) {
    .aidev-shell-header-inner {
      gap: var(--aidev-space-3);
    }

    .aidev-shell-search {
      display: none;
    }

    .aidev-shell-footer-inner {
      flex-direction: column;
      align-items: flex-start;
      padding: var(--aidev-space-5) var(--aidev-space-4);
    }
  }
</style>
