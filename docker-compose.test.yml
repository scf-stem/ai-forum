services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: forum_test
      POSTGRES_PASSWORD: forum_test
      POSTGRES_DB: forum_test
    ports: ["55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--databases", "2"]
    ports: ["56379:6379"]
